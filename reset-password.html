<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — ZSB</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">Z</div>
        <div>
          <h1>Set a new password</h1>
          <p class="muted small" id="forEmail">&nbsp;</p>
        </div>
      </div>

      <div id="invalidState" hidden>
        <p class="error" id="invalidMessage"></p>
        <p class="hint muted"><a href="forgot-password.html" class="btn-link">Request a new reset link</a></p>
      </div>

      <form id="resetForm" novalidate hidden>
        <label>New password
          <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" required />
        </label>
        <label>Confirm new password
          <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" required />
        </label>

        <p class="error" id="resetError" hidden></p>

        <button type="submit" class="btn btn-primary btn-block">Reset password</button>
      </form>

      <div id="doneState" hidden>
        <div class="banner success">Your password has been reset. You can now sign in with it.</div>
        <p class="hint muted"><a href="login.html" class="btn-link">Continue to sign in →</a></p>
      </div>

      <p class="hint muted" id="backLink"><a href="login.html" class="btn-link">← Back to sign in</a></p>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/reset-password.js"></script>
</body>
</html>
